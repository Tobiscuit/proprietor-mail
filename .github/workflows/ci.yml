# A clean install from the lockfile, the typecheck and the tests, on every pull
# request (whatever its base, so the stacked PRs run too) and every push to main.
#
# `pull_request`, never `pull_request_target`: a pull request from a fork runs
# with a read-only token and no secrets, and none are used here anyway.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. A push to main has
# no head_ref, so it groups by its own run id and never cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs; the comment is the release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The mail-client's browser tests (contracts/mail-client-v1.md, "Tests this contract requires"):
  # real Chromium, Firefox and WebKit through Playwright, a page under the dashboard's exact policy
  # with Trusted Types enforced, and Chromium's virtual authenticator with PRF. They run only here
  # and on request (`npm run test:browsers -w @proprietor/mail-client`), never silently skipped.
  browsers:
    name: mail-client in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers -w @proprietor/mail-client
