# On every pull request, fail if it adds a dependency with a known
# vulnerability. It runs with a read-only token and posts no comments.
#
# Dependency review needs a public repository (or GitHub Advanced Security),
# so while this repository is private the job is skipped rather than failed.
name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency review
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Any severity, in what ships: the Worker's and the packages' runtime
          # dependencies. Development tools are left to Dependabot.
          fail-on-severity: low
          fail-on-scopes: runtime
