# A tag mail-crypto-vX.Y.Z releases @platform-mail/crypto. One set of bytes,
# computed here from the tagged tree and never by hand, is published three
# ways:
#
#   - a GitHub release with SHA256SUMS (packages/mail-crypto/src/, file by
#     file; the dashboard's vendoring script checks its copy against it) and
#     the npm tarball;
#   - GitHub artifact attestations (SLSA build provenance) for both files;
#   - the same tarball, staged on npm through trusted publishing: OIDC, no
#     token, with npm provenance. A maintainer then approves the staged
#     version with 2FA (`npm stage approve <id>`, or on npmjs.com), and only
#     then can anyone install it.
#
# It refuses unless the tagged commit is already on main (never release
# unreviewed code) and the tag's version is package.json's.
#
# Jobs, and the one thing each may do:
#   verify   read-only. The checks, `npm ci`, the package's tests.
#   build    packs the tarball and computes SHA256SUMS without installing
#            anything, then attests both (id-token, attestations).
#   npm      stages the tarball on npm (id-token, in the npm-publish
#            environment, which the npm trusted publisher is bound to).
#   release  creates the GitHub release (contents: write).
# Nothing that `npm ci` installs runs in a job that holds a write permission
# or can mint an OIDC token, and no job has a secret.
#
# Before the first run: the npm package and its trusted publisher must exist
# (README.md, "Releases").
name: Release mail-crypto

on:
  push:
    tags: ["mail-crypto-v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All branches and tags: the ancestry check needs origin/main.
          fetch-depth: 0

      - name: Refuse a tagged commit that is not on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [ "$commit" != "$(git rev-parse HEAD)" ]; then
            echo "::error title=Refused::$TAG points at $commit, but the checkout is $(git rev-parse HEAD)."
            exit 1
          fi
          status=0
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || status=$?
          case "$status" in
            0) echo "$TAG is $commit, which is on main." ;;
            1) echo "::error title=Refused::$TAG is $commit, which is not on main. Only reviewed code is released: merge first, then tag a commit on main."
               exit 1 ;;
            *) echo "::error title=Refused::git merge-base failed with status $status."
               exit 1 ;;
          esac

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No dependency cache on the release path: nothing restored, nothing to poison.
          package-manager-cache: false

      - name: Refuse a tag whose version is not package.json's
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tagged="${TAG#mail-crypto-v}"
          declared=$(node -p 'JSON.parse(require("node:fs").readFileSync("packages/mail-crypto/package.json", "utf8")).version')
          if [ "$tagged" != "$declared" ]; then
            echo "::error title=Refused::$TAG says version $tagged, but packages/mail-crypto/package.json says $declared."
            exit 1
          fi
          echo "Version $declared matches the tag."

      - name: Refuse a package license that differs from the repository's
        run: cmp LICENSE packages/mail-crypto/LICENSE

      - run: npm ci

      - name: The package's tests
        run: npm test --workspace packages/mail-crypto

  build:
    name: pack, sum and attest
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the Sigstore certificate for the attestations
      attestations: write # store the attestations with the repository
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball-sha256: ${{ steps.pack.outputs.tarball-sha256 }}
      sums-sha256: ${{ steps.pack.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # No `npm ci`: packing needs nothing installed, and --ignore-scripts runs
      # no lifecycle script. Node built-ins compute SHA256SUMS.
      - name: Pack the tarball and compute SHA256SUMS
        id: pack
        run: |
          mkdir dist
          tarball=$(npm pack ./packages/mail-crypto --ignore-scripts --pack-destination dist --json \
            | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s)[0].filename))')
          node packages/mail-crypto/scripts/sha256sums.mjs > dist/SHA256SUMS
          (cd packages/mail-crypto && sha256sum --check --strict ../../dist/SHA256SUMS)
          cat dist/SHA256SUMS
          {
            echo "tarball=$tarball"
            echo "tarball-sha256=$(sha256sum "dist/$tarball" | cut -d' ' -f1)"
            echo "sums-sha256=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Attest the tarball and SHA256SUMS
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.pack.outputs.tarball }}
            dist/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  npm:
    name: stage on npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm trusted publisher names this environment, and the environment
    # only accepts mail-crypto-v* tags: nothing else can publish.
    environment: npm-publish
    permissions:
      contents: read # .nvmrc only
      id-token: write # trusted publishing and npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Refuse a tarball that is not the one the build job attested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.tarball-sha256 }}
        run: |
          echo "$EXPECTED  dist/$TARBALL" | sha256sum --check --strict

      - name: Refuse an npm without staged publishing (11.15.0 or later)
        run: |
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) { console.error(`npm ${process.argv[1]} is too old for npm stage publish`); process.exit(1); }
          ' "$(npm --version)"

      - name: Stage the tarball (a maintainer approves it with 2FA)
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        # "./" matters: npm reads a bare "dist/<file>" as a GitHub user/repo.
        run: npm stage publish "./dist/$TARBALL" --provenance --access public --ignore-scripts

  release:
    name: create the GitHub release
    needs: [build, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its two files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: Refuse files that are not the ones the build job attested
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build.outputs.tarball-sha256 }}
          SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          printf '%s  %s\n%s  %s\n' "$TARBALL_SHA256" "dist/$TARBALL" "$SUMS_SHA256" dist/SHA256SUMS | sha256sum --check --strict

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          notes="Built by CI from $GITHUB_SHA ($run_url).

          - SHA256SUMS lists packages/mail-crypto/src/ file by file. Check a vendored copy from the directory that holds its src/: sha256sum --check --strict SHA256SUMS
          - $TARBALL is the exact tarball staged on npm.
          - Both carry GitHub artifact attestations: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
          gh release create "$TAG" "dist/SHA256SUMS" "dist/$TARBALL" --verify-tag --title "$TAG" --notes "$notes"
